name: Feature request
description: Propose a scoped product, pipeline, or QA improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or research problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: Historical-data semantics and sources
      description: Explain provenance, licensing, identity, time, and coverage implications.
    validations:
      required: true
