name: Bug report
description: Report a reproducible software defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach third-party datasets, API tokens, or private QA artifacts.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Run …\n2. Open …\n3. Observe …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Node.js, and browser versions.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Data provenance (if relevant)
      description: Source name and record IDs only; do not upload restricted data.
