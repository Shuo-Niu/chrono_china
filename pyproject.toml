[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chronochina"
version = "0.1.0"
description = "Reproducible Phase 0/1 data POC for the ChronoChina historical map"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["historical-geography", "china", "maplibre", "tgaz", "chgis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "httpx>=0.28,<0.29",
  "mapbox-vector-tile>=2.2,<3",
  "pyshp>=2.3,<4",
  "shapely>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
chronochina = "chronochina.cli:main"

[project.urls]
Homepage = "https://github.com/Shuo-Niu/chrono_china"
Repository = "https://github.com/Shuo-Niu/chrono_china.git"
Issues = "https://github.com/Shuo-Niu/chrono_china/issues"

[tool.setuptools]
package-dir = {"" = "pipeline"}

[tool.setuptools.packages.find]
where = ["pipeline"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["pipeline/tests"]
